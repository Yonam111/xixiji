                </div>
            </div>

            { id: 35, title: "小米米家桌面空气加湿器", category: "life", price: 35.00, condition: "9成新", location: "3号宿舍楼快递驿站旁", seller: "丁同学", image: " https://img30.360buyimg.com/shaidan/s300x300_jfs/t1/435399/34/11584/66269/6a0badebF3ed66306/00a95286e0c9d50f.jpg.dpg ", desc: "秋冬宿舍保湿神器，静音运行。" }

        let orders = [];
        let currentCategory = 'all';

        // 切换视图函数
        function switchTab(tabId) {
            ['home', 'detail', 'publish', 'orders'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (tabId === 'home') renderProducts();
        }

        // 渲染商品列表
        function renderProducts(list = products) {
            const grid = document.getElementById('productGrid');
            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400">没有找到相关的闲置物品或书籍</div>`;
                return;
            }
            grid.innerHTML = list.map(item => `
                <div onclick="showDetail(${item.id})" class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md hover:border-teal-500 transition-all cursor-pointer flex flex-col">
                    <div class="h-40 w-full bg-gray-100 overflow-hidden relative">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[10px] px-2 py-0.5 rounded-full">${item.condition}</span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                        <h3 class="text-sm font-semibold text-gray-800 line-clamp-2">${item.title}</h3>
                        <div>
                            <div class="text-teal-600 font-bold text-base">￥${item.price.toFixed(2)}</div>
                            <div class="text-[11px] text-gray-400 truncate mt-1 flex items-center space-x-1">
                                <i class="fa-solid fa-location-dot"></i>
                                <span>自提：${item.location}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 分类筛选
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 transition-all";
            });
            const activeBtn = document.getElementById('cat-' + cat);
            if(activeBtn) {
                activeBtn.className = "cat-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap bg-teal-600 text-white shadow-sm transition-all";
            }
            
            if (cat === 'all') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        // 搜索功能
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // 显示商品详情
        function showDetail(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;
            
            const container = document.getElementById('detailContainer');
            container.innerHTML = `
                <div class="rounded-xl overflow-hidden bg-gray-100 h-80 md:h-[400px]">
                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col justify-between space-y-4">
                    <div>
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="bg-teal-100 text-teal-800 text-xs px-2.5 py-1 rounded-full font-medium">${item.condition}</span>
                            <span class="text-xs text-gray-400">发布者：${item.seller}</span>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 mb-3">${item.title}</h1>
                        <div class="text-2xl font-extrabold text-teal-600 mb-4">￥${item.price.toFixed(2)}</div>
                        <div class="bg-gray-50 rounded-xl p-3 space-y-2 text-sm text-gray-600 border border-gray-100">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-location-dot text-teal-600"></i>
                                <span><strong>校内自提点：</strong>${item.location}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-shield-halved text-teal-600"></i>
                                <span><strong>交易保障：</strong>嘻嘻集二手校内实名认证，当面检查无误后楼长网点确认</span>
                            </div>
                        </div>
                        <div class="mt-4">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">卖家描述</h4>
                            <p class="text-sm text-gray-600 leading-relaxed">${item.desc}</p>
                        </div>
                    </div>
                    <button onclick="buyProduct(${item.id})" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-semibold shadow-md transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>立即下单（校内自提）</span>
                    </button>
                </div>
            `;
            switchTab('detail');
        }

        // 下单购买模拟
        function buyProduct(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;

            const order = {
                orderNo: 'XX' + Date.now().toString().slice(-6),
                title: item.title,
                price: item.price,
                location: item.location,
                image: item.image,
                time: new Date().toLocaleString()
            };

            orders.unshift(order);
            updateOrderBadge();
            renderOrders();
            alert(`下单成功！\n订单编号：${order.orderNo}\n请前往“${order.location}”凭取货码当面验货自提。`);
            switchTab('orders');
        }

        // 更新订单角标
        function updateOrderBadge() {
            const badge = document.getElementById('orderBadge');
            if (orders.length > 0) {
                badge.innerText = orders.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // 渲染我的订单
        function renderOrders() {
            const list = document.getElementById('orderList');
            if (orders.length === 0) {
                list.innerHTML = `<div class="py-12 text-center text-gray-400 bg-white rounded-xl border border-gray-200">暂无已购订单，快去挑选需要的二手好书吧！</div>`;
                return;
            }
            list.innerHTML = orders.map(o => `
                <div class="bg-white rounded-xl border border-gray-200 p-4 flex items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-4">
                        <img src="${o.image}" class="w-16 h-16 object-cover rounded-lg border">
                        <div>
                            <div class="text-xs text-gray-400">订单号：${o.orderNo} | 下单时间：${o.time}</div>
                            <h4 class="font-semibold text-gray-800 text-sm mt-0.5">${o.title}</h4>
                            <div class="text-xs text-teal-600 font-medium mt-1"><i class="fa-solid fa-location-dot"></i> 自提点：${o.location}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-teal-600">￥${o.price.toFixed(2)}</div>
                        <span class="inline-block bg-green-50 text-green-600 text-xs px-2.5 py-0.5 rounded-full font-medium mt-1">待自提</span>
                    </div>
                </div>
            `).join('');
        }

        // 发布闲置处理
        function handlePublish(e) {
            e.preventDefault();
            const newTitle = document.getElementById('pubTitle').value;
            const newCat = document.getElementById('pubCategory').value;
            const newPrice = parseFloat(document.getElementById('pubPrice').value);
            const newCond = document.getElementById('pubCondition').value;
            const newLoc = document.getElementById('pubLocation').value;
            const newImg = document.getElementById('pubImage').value;
            const newDesc = document.getElementById('pubDesc').value;

            const newItem = {
                id: products.length + 1,
                title: newTitle,
                category: newCat,
                price: newPrice,
                condition: newCond,
                location: newLoc,
                seller: "我 (当前用户)",
                image: newImg,
                desc: newDesc || "暂无详细描述"
            };

            products.unshift(newItem);
            alert("恭喜您，在【嘻嘻集二手】发布闲置成功！");
            document.getElementById('publishForm').reset();
            switchTab('home');
        }

        // 初始化加载
        renderProducts();
    </script>
</body>
